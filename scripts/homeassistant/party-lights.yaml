# Party lights for the Lounge light bars (docs/party-lights.md).
#
# A Home Assistant package: copy it to /config/packages/party_lights.yaml. The dashboard's
# Party lights card sets the helpers below; this file turns them into commands for the bars:
#   - on/off and steady colors go straight to the bars over the home network (Govee lights local)
#   - "Strobe to music" switches on the bars' music mode through Govee's cloud API, because
#     that isn't something they accept locally. The bars' own mic keeps the beat.
#   - strobing with "Album colors" goes straight to the bars over the home network in Govee's
#     Shiny music style, one album color per bar (scripts/homeassistant/govee-music-lan.py), because
#     the cloud's music mode ignores the color on these bars. Needs the bars' address below.
#   - with "Album colors" on, the music mode uses one of the album's colors, moving on to the
#     next every 30, 60 or 90 seconds. Steady, each half of the bars gets its own album color
#     (this one and the next) through the cloud's segment colors; music mode takes only one. When the Lounge album changes, Home Assistant picks its
#     colors from the cover with /config/party/album-palette.py (no dashboard needs to be open).
# The Govee API key lives in secrets.yaml (govee_api_key), never in this repo.
#
# Govee allows 10,000 cloud commands a day per account. Changing every 30 seconds uses
# about 2,900 a day strobing, or 5,800 steady (two halves), if left on around the clock.

input_boolean:
  party_lights_strobe:
    name: Party lights strobe to music
    icon: mdi:music-note
  party_lights_album_colors:
    name: Party lights album colors
    icon: mdi:palette

# Govee's music styles offered on the dashboard, Rhythm first (the default). Rhythm keeps to the
# one color we send. A name the bars don't offer falls back to Rhythm, else their first style.
input_select:
  party_lights_music_style:
    name: Party lights music style
    icon: mdi:waveform
    options:
      - Rhythm
      - Strike
      - Beat
      - Vibrate

input_number:
  party_lights_change_seconds:
    name: Party lights change every
    min: 30
    max: 90
    step: 30
    unit_of_measurement: s
    icon: mdi:timer-outline
  party_lights_sensitivity:
    name: Party lights mic sensitivity
    min: 0
    max: 100
    step: 5
    icon: mdi:microphone
  party_lights_color_index:
    name: Party lights color showing
    min: 0
    max: 9
    step: 1
    mode: box

input_text:
  party_lights_palette:
    name: Party lights album colors
    max: 255
  # The bars' address on the home network (e.g. 192.168.4.60), set once in Settings → Helpers.
  # With it, strobing in album colors goes straight to the bars, one album color per bar.
  party_lights_address:
    name: Party lights bars address
    max: 15
    icon: mdi:ip-network

# Finds the bars in Govee's cloud once a day (and at startup):
# "sku|device|Style=value;Style=value;...|segments" with the music styles the bars offer and
# how many segments the cloud can color one by one (0 if none).
# The bars are the H6046, or the device named with "lounge" or "bar" in the Govee Home app.
rest:
  - resource: https://openapi.api.govee.com/router/api/v1/user/devices
    headers:
      Govee-API-Key: !secret govee_api_key
    scan_interval: 86400
    sensor:
      - name: Govee party bars
        unique_id: meadowlake_govee_party_bars
        icon: mdi:led-strip-variant
        value_template: >-
          {%- set ns = namespace(d=none) -%}
          {%- for d in (value_json.data if value_json is mapping and value_json.data is list else []) -%}
            {%- set name = (d.deviceName | default('')) | lower -%}
            {%- if ns.d is none and (d.sku == 'H6046' or 'lounge' in name or 'bar' in name) -%}{%- set ns.d = d -%}{%- endif -%}
          {%- endfor -%}
          {%- if ns.d is none -%}not found
          {%- else -%}
            {%- set cap = ns.d.capabilities | default([]) | selectattr('instance', 'eq', 'musicMode') | list -%}
            {%- set fields = cap[0].parameters.fields | default([]) if cap else [] -%}
            {%- set field = fields | selectattr('fieldName', 'eq', 'musicMode') | list -%}
            {%- set opts = field[0].options | default([]) if field else [] -%}
            {%- set seg = ns.d.capabilities | default([]) | selectattr('instance', 'eq', 'segmentedColorRgb') | list -%}
            {%- set sfields = seg[0].parameters.fields | default([]) if seg else [] -%}
            {%- set sfield = sfields | selectattr('fieldName', 'eq', 'segment') | list -%}
            {%- set segs = ((sfield[0].elementRange.max | default(-1) | int(-1)) + 1) if sfield and sfield[0].elementRange is defined else 0 -%}
            {%- if opts -%}{{ ns.d.sku }}|{{ ns.d.device }}|{% for o in opts %}{{ o.name }}={{ o.value }}{{ ';' if not loop.last }}{% endfor %}|{{ segs }}{%- else -%}no music mode{%- endif -%}
          {%- endif -%}

# Picks up to five colors from the Lounge zone's album cover (scripts/homeassistant/album-palette.py).
shell_command:
  party_album_palette: >-
    python3 /config/party/album-palette.py "{{ state_attr('media_player.1_lounge_linn_klimax', 'entity_picture') }}"
  # Test: music mode in chosen colors over the home network (scripts/homeassistant/govee-music-lan.py).
  # Data: ip (the bars' address), style (their id for a music style, e.g. "0x72"), sensitivity, colors ("#0000ff").
  party_lights_lan: >-
    python3 /config/party/govee-music-lan.py "{{ ip }}" "{{ style | default('0x72') }}" "{{ sensitivity | default(70) }}" "{{ colors | default('#0000ff') }}"

rest_command:
  govee_party_music:
    url: https://openapi.api.govee.com/router/api/v1/device/control
    method: POST
    headers:
      Govee-API-Key: !secret govee_api_key
    content_type: application/json
    payload: >-
      {"requestId": "{{ now().timestamp() | int }}",
       "payload": {"sku": "{{ sku }}", "device": "{{ device }}",
        "capability": {"type": "devices.capabilities.music_setting", "instance": "musicMode",
         "value": {"musicMode": {{ mode }}, "sensitivity": {{ sensitivity }}, "autoColor": {{ auto_color }}{% if rgb is defined and rgb != '' %}, "rgb": {{ rgb }}{% endif %}}}}}

  govee_party_segments:
    url: https://openapi.api.govee.com/router/api/v1/device/control
    method: POST
    headers:
      Govee-API-Key: !secret govee_api_key
    content_type: application/json
    payload: >-
      {"requestId": "{{ now().timestamp() }}-{{ first }}",
       "payload": {"sku": "{{ sku }}", "device": "{{ device }}",
        "capability": {"type": "devices.capabilities.segment_color_setting", "instance": "segmentedColorRgb",
         "value": {"segment": {{ range(first | int, last | int) | list | to_json }}, "rgb": {{ rgb }}}}}}

script:
  party_lights_apply:
    alias: Party lights apply
    description: Sends the Party lights settings to the Lounge light bars.
    mode: restart
    variables:
      light: light.lounge_lights
      cloud: "{{ states('sensor.govee_party_bars').split('|') }}"
      styles: >-
        {% set ns = namespace(m={}) %}
        {% for kv in (cloud[2].split(';') if cloud | count >= 3 else []) if '=' in kv %}
          {% set ns.m = dict(ns.m, **{kv.split('=')[0]: kv.split('=')[1]}) %}
        {% endfor %}
        {{ ns.m }}
      style: >-
        {% set want = states('input_select.party_lights_music_style') %}
        {{ styles[want] if want in styles else styles['Rhythm'] if 'Rhythm' in styles else (styles.values() | list | first if styles else '') }}
      palette: >-
        {{ states('input_text.party_lights_palette').split(',') | map('trim') | select('match', '^#[0-9a-fA-F]{6}$') | list }}
      index: "{{ states('input_number.party_lights_color_index') | int(0) }}"
      color: "{{ palette[index % (palette | count)] if palette | count else '' }}"
      album: "{{ is_state('input_boolean.party_lights_album_colors', 'on') and color != '' }}"
      rgb: "{{ [color[1:3] | int(base=16), color[3:5] | int(base=16), color[5:7] | int(base=16)] if color else [] }}"
      # Steady: the second half of the bars shows the album's next color.
      segments: "{{ cloud[3] | int(0) if cloud | count >= 4 else 0 }}"
      color2: "{{ palette[(index + 1) % (palette | count)] if palette | count > 1 else color }}"
      split: "{{ album and segments >= 2 and palette | count > 1 }}"
      address: "{{ states('input_text.party_lights_address') | trim }}"
      lan: "{{ album and address is match('^\\d{1,3}(\\.\\d{1,3}){3}$') }}"
    sequence:
      - condition: template
        value_template: "{{ is_state(light, 'on') }}"
      - if:
          - condition: state
            entity_id: input_boolean.party_lights_strobe
            state: "on"
        then:
          # Album colors over the home network: Shiny, this color on one bar and the next on the other.
          - if:
              - condition: template
                value_template: "{{ lan }}"
            then:
              - action: shell_command.party_lights_lan
                data:
                  ip: "{{ address }}"
                  style: "0x31"
                  sensitivity: "{{ states('input_number.party_lights_sensitivity') | int(70) }}"
                  colors: "{{ color ~ (',' ~ color2 if color2 != color else '') }}"
              - stop: Sent over the home network
          - condition: template
            value_template: "{{ cloud | count >= 3 and style != '' }}"
          # With Album colors on, only an album color goes to the bars, never Govee's own.
          - condition: template
            value_template: "{{ album or not is_state('input_boolean.party_lights_album_colors', 'on') }}"
          - action: rest_command.govee_party_music
            data:
              sku: "{{ cloud[0] }}"
              device: "{{ cloud[1] }}"
              mode: "{{ style }}"
              sensitivity: "{{ states('input_number.party_lights_sensitivity') | int(70) }}"
              auto_color: "{{ 0 if album else 1 }}"
              rgb: "{{ (rgb[0] * 65536 + rgb[1] * 256 + rgb[2]) if album else '' }}"
        else:
          - choose:
              # Each half of the bars in its own album color, through the cloud.
              - conditions:
                  - condition: template
                    value_template: "{{ split }}"
                sequence:
                  - action: rest_command.govee_party_segments
                    data:
                      sku: "{{ cloud[0] }}"
                      device: "{{ cloud[1] }}"
                      first: 0
                      last: "{{ segments // 2 }}"
                      rgb: "{{ color[1:7] | int(base=16) }}"
                  - action: rest_command.govee_party_segments
                    data:
                      sku: "{{ cloud[0] }}"
                      device: "{{ cloud[1] }}"
                      first: "{{ segments // 2 }}"
                      last: "{{ segments }}"
                      rgb: "{{ color2[1:7] | int(base=16) }}"
              # Album colors on: an album color, or (no colors picked yet) leave the bars as they are.
              - conditions:
                  - condition: template
                    value_template: "{{ is_state('input_boolean.party_lights_album_colors', 'on') }}"
                sequence:
                  - if:
                      - condition: template
                        value_template: "{{ album }}"
                    then:
                      - action: light.turn_on
                        target:
                          entity_id: "{{ light }}"
                        data:
                          rgb_color: "{{ rgb }}"
            default:
              - action: light.turn_on
                target:
                  entity_id: "{{ light }}"
                data:
                  color_temp_kelvin: 3000

automation:
  - id: meadowlake_party_lights_changed
    alias: Party lights changed
    description: Applies the Party lights settings whenever the dashboard changes one, or the bars come on.
    mode: restart
    triggers:
      - trigger: state
        entity_id: light.lounge_lights
        to: "on"
      - trigger: state
        entity_id:
          - input_boolean.party_lights_strobe
          - input_boolean.party_lights_album_colors
          - input_select.party_lights_music_style
          - input_number.party_lights_sensitivity
          - input_number.party_lights_color_index
          - input_text.party_lights_address
          - sensor.govee_party_bars
      - trigger: state
        entity_id: input_text.party_lights_palette
        id: new_album
    actions:
      # Waits a moment so a slider drag sends one command, not one per step.
      - delay: 1
      - if:
          - condition: trigger
            id: new_album
          - condition: template
            value_template: "{{ states('input_number.party_lights_color_index') | int(0) != 0 }}"
        then:
          # A new album starts on its first color; that change runs this automation again.
          - action: input_number.set_value
            target:
              entity_id: input_number.party_lights_color_index
            data:
              value: 0
        else:
          - action: script.party_lights_apply

  - id: meadowlake_party_lights_album
    alias: Party lights album colors
    description: Picks new colors from the cover when the Lounge album changes.
    mode: restart
    triggers:
      - trigger: state
        entity_id: media_player.1_lounge_linn_klimax
        attribute: entity_picture
      - trigger: homeassistant
        event: start
    conditions:
      - condition: template
        value_template: "{{ state_attr('media_player.1_lounge_linn_klimax', 'entity_picture') not in [none, ''] }}"
      # The picture's address carries a token that changes every few minutes; only a new cover counts.
      - condition: template
        value_template: >-
          {% if trigger.platform != 'state' or trigger.from_state is none %}true{% else %}
          {% set old = (trigger.from_state.attributes.entity_picture or '') | regex_replace('token=[^&]*', '') %}
          {% set new = (trigger.to_state.attributes.entity_picture or '') | regex_replace('token=[^&]*', '') %}
          {{ old != new }}{% endif %}
    actions:
      - delay: 2
      - action: shell_command.party_album_palette
        response_variable: picked
      - if:
          - condition: template
            value_template: "{{ picked.returncode == 0 and (picked.stdout | trim) is match('^#[0-9a-f]{6}') }}"
        then:
          - action: input_text.set_value
            target:
              entity_id: input_text.party_lights_palette
            data:
              value: "{{ picked.stdout | trim }}"

  - id: meadowlake_party_lights_cycle
    alias: Party lights next color
    description: Moves to the album's next color every 30, 60 or 90 seconds while the bars are on.
    mode: single
    triggers:
      - trigger: time_pattern
        seconds: "/10"
    conditions:
      - condition: state
        entity_id: light.lounge_lights
        state: "on"
      - condition: state
        entity_id: input_boolean.party_lights_album_colors
        state: "on"
      - condition: template
        value_template: >-
          {{ states('input_text.party_lights_palette').split(',') | select('match', '^#[0-9a-fA-F]{6}$') | list | count > 1
             and (now() - states.input_number.party_lights_color_index.last_changed).total_seconds()
                 >= states('input_number.party_lights_change_seconds') | int(60) - 5 }}
    actions:
      - action: input_number.set_value
        target:
          entity_id: input_number.party_lights_color_index
        data:
          value: >-
            {% set n = states('input_text.party_lights_palette').split(',') | select('match', '^#[0-9a-fA-F]{6}$') | list | count %}
            {{ (states('input_number.party_lights_color_index') | int(0) + 1) % n }}
